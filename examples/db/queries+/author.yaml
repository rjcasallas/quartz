author:
  select_full: |
    SELECT a.*, NULL AS `rank`
      FROM `author` a

  select_full_by_pk: |
    @author/select_full
     WHERE a.`id` = ?

  select_full_by_name: |
    @author/select_full
     WHERE a.`name` = ?

  select_ref_by_book: |
    @author/select_ref
      INNER JOIN `book_author` ba
         ON ba.`author_id` = a.`id`
      INNER JOIN `book` b
         ON b.`id` = ba.`book_id`
      WHERE b.`id` = ?

  select_all_by_book: |
    @author/select_all
      INNER JOIN `book_author` ba
         ON ba.`author_id` = a.`id`
      INNER JOIN `book` b
         ON b.`id` = ba.`book_id`
      WHERE b.`id` = ?

  select_full_by_book: |
    SELECT a.*, ba.`rank`
      FROM `author` a
      INNER JOIN `book_author` ba
         ON ba.`author_id` = a.`id`
      INNER JOIN `book` b
         ON b.`id` = ba.`book_id`
      WHERE b.`id` = ?
