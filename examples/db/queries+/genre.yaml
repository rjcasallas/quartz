genre:
  select_full: |
    @genre/select_all

  select_full_by_pk: |
    @genre/select_full
     WHERE g.`id` = ?

  select_full_by_name: |
    @genre/select_full
     WHERE g.`name` = ?

  select_ref_by_book: |
    @genre/select_ref
     INNER JOIN `book_genre` bg
        ON bg.`genre_id` = g.`id`
     INNER JOIN `book` b
        ON b.`id` = bg.`book_id`
     WHERE b.`id` = ?

  select_full_by_book: |
    @genre/select_full
     INNER JOIN `book_genre` bg
        ON bg.`genre_id` = g.`id`
     INNER JOIN `book` b
        ON b.`id` = bg.`book_id`
     WHERE b.`id` = ?

  select_ref_by_parent: |
    @genre/select_ref
     INNER JOIN `subgenre` sg
        ON sg.`child_id` = g.`id`
     WHERE sg.`parent_id` = ?

  select_full_by_parent: |
    @genre/select_full
     INNER JOIN `subgenre` sg
        ON sg.`child_id` = g.`id`
     WHERE sg.`parent_id` = ?

  select_ref_by_child: |
    @genre/select_ref
     INNER JOIN `subgenre` sg
        ON sg.`parent_id` = g.`id`
     WHERE sg.`child_id` = ?

  select_full_by_child: |
    @genre/select_full
     INNER JOIN `subgenre` sg
        ON sg.`parent_id` = g.`id`
     WHERE sg.`child_id` = ?

