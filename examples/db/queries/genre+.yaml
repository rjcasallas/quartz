genre:
  select_ref_by_book: |
    @genre/select_ref
      INNER JOIN `book_genre` bg
         ON bg.`genre_id` = g.`id`
      INNER JOIN `book` b
         ON b.`id` = bg.`book_id`
      WHERE b.`id` = ?

  select_all_by_book: |
    @genre/select_all
      INNER JOIN `book_genre` bg
         ON bg.`genre_id` = g.`id`
      INNER JOIN `book` b
         ON b.`id` = bg.`book_id`
      WHERE b.`id` = ?
