book:
  select_ref: |
    SELECT b.`id`
      FROM `book` b

  select_all: |
    SELECT b.*
      FROM `book` b

  select_ref_by_pk: |
    @book/select_ref
     WHERE b.`id`=?

  select_all_by_pk: |
    @book/select_all
     WHERE b.`id`=?

  select_ref_by_publisher: |
    @book/select_ref
      WHERE b.`publisher_id`=?

  select_all_by_publisher: |
    @book/select_all
      WHERE b.`publisher_id`=?

  select_ref_by_title: |
    @book/select_ref
      WHERE b.`title`=?

  select_all_by_title: |
    @book/select_all
      WHERE b.`title`=?

  insert: |
    INSERT INTO `book`(`publisher_id`, `title`, `year`)
    VALUES (?, ?, ?)

  insert_id: |
    INSERT INTO `book`(`id`, `publisher_id`, `title`, `year`)
    VALUES (?, ?, ?, ?)

  update: |
    UPDATE `book`
       SET `publisher_id`=?, `title`=?, `year`=?
     WHERE `id`=?

  delete_all: |
    DELETE FROM `book`

  delete_pk: |
    DELETE FROM `book`
     WHERE `id`=?

  delete_publisher: |
    DELETE FROM `book`
     WHERE `publisher_id`=?

  delete_title: |
    DELETE FROM `book`
     WHERE `title`=?


