genre:
  select_ref: |
    SELECT g.`id`
      FROM `genre` g

  select_all: |
    SELECT g.*
      FROM `genre` g

  select_ref_by_pk: |
    @genre/select_ref
     WHERE g.`id`=?

  select_all_by_pk: |
    @genre/select_all
     WHERE g.`id`=?

  select_ref_by_name: |
    @genre/select_ref
      WHERE g.`name`=?

  select_all_by_name: |
    @genre/select_all
      WHERE g.`name`=?

  insert: |
    INSERT INTO `genre`(`name`)
    VALUES (?)

  insert_id: |
    INSERT INTO `genre`(`id`, `name`)
    VALUES (?, ?)

  update: |
    UPDATE `genre`
       SET `name`=?
     WHERE `id`=?

  delete_all: |
    DELETE FROM `genre`

  delete_pk: |
    DELETE FROM `genre`
     WHERE `id`=?

  delete_name: |
    DELETE FROM `genre`
     WHERE `name`=?


