book:
  select_ref_by_author: |
    @book/select_ref
      INNER JOIN `book_author` ba
         ON ba.`book_id` = b.`id`
      INNER JOIN `author` a
         ON a.`id` = ba.`author_id`
      WHERE a.`id` = ?

  select_all_by_author: |
    @book/select_all
      INNER JOIN `book_author` ba
         ON ba.`book_id` = b.`id`
      INNER JOIN `author` a
         ON a.`id` = ba.`author_id`
      WHERE a .`id` = ?

  select_ref_by_genre: |
    @book/select_ref
      INNER JOIN `book_genre` bg
         ON bg.`book_id` = b.`id`
      INNER JOIN `genre` g
         ON g.`id` = bg.`genre_id`
      WHERE g.`id` = ?

  select_all_by_genre: |
    @book/select_all
      INNER JOIN `book_genre` bg
         ON bg.`book_id` = b.`id`
      INNER JOIN `genre` g
         ON g.`id` = bg.`genre_id`
      WHERE g.`id` = ?

  select_ref_by_year: |
    @book/select_ref
      WHERE b.`year` = ?

  select_all_by_year: |
    @book/select_all
      WHERE b.`year` = ?
