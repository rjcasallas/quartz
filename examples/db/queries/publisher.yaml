publisher:
  select_ref: |
    SELECT p.`id`
      FROM `publisher` p

  select_all: |
    SELECT p.*
      FROM `publisher` p

  select_ref_by_pk: |
    @publisher/select_ref
     WHERE p.`id`=?

  select_all_by_pk: |
    @publisher/select_all
     WHERE p.`id`=?

  select_ref_by_parent: |
    @publisher/select_ref
      WHERE p.`parent_id`=?

  select_all_by_parent: |
    @publisher/select_all
      WHERE p.`parent_id`=?

  select_ref_by_name: |
    @publisher/select_ref
      WHERE p.`name`=?

  select_all_by_name: |
    @publisher/select_all
      WHERE p.`name`=?

  insert: |
    INSERT INTO `publisher`(`parent_id`, `name`)
    VALUES (?, ?)

  insert_id: |
    INSERT INTO `publisher`(`id`, `parent_id`, `name`)
    VALUES (?, ?, ?)

  update: |
    UPDATE `publisher`
       SET `parent_id`=?, `name`=?
     WHERE `id`=?

  delete_all: |
    DELETE FROM `publisher`

  delete_pk: |
    DELETE FROM `publisher`
     WHERE `id`=?

  delete_parent: |
    DELETE FROM `publisher`
     WHERE `parent_id`=?

  delete_name: |
    DELETE FROM `publisher`
     WHERE `name`=?


