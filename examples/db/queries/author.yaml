author:
  select_ref: |
    SELECT a.`id`
      FROM `author` a

  select_all: |
    SELECT a.*
      FROM `author` a

  select_ref_by_pk: |
    @author/select_ref
     WHERE a.`id` = ?

  select_all_by_pk: |
    @author/select_all
     WHERE a.`id` = ?

  select_ref_by_name: |
    @author/select_ref
      WHERE a.`name` = ?

  select_all_by_name: |
    @author/select_all
      WHERE a.`name` = ?

  insert: |
    INSERT INTO `author`(`name`)
    VALUES (?)

  insert_id: |
    INSERT INTO `author`(`id`, `name`)
    VALUES (?, ?)

  update: |
    UPDATE `author`
       SET `name` = ?
     WHERE `id` = ?

  delete: |
    DELETE FROM `author`

  delete_id: |
    DELETE FROM `author`
     WHERE `id` = ?

  delete_name: |
    DELETE FROM `author`
     WHERE `name` = ?


